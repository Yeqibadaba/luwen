<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <rect width="1100" height="500" fill="white"/>
  <style>
    .t{font-family:'Noto Sans CJK SC','Microsoft YaHei','SimSun',sans-serif;fill:#222}
    .axis{stroke:#222;stroke-width:1.2}
    .grid{stroke:#d9d9d9;stroke-width:0.8;stroke-dasharray:4 4}
    .small{font-size:14px}
    .mid{font-size:16px}
    .title{font-size:18px;font-weight:600}
    .value{font-size:13px}
  </style>

  <!-- Left panel -->
  <text x="245" y="30" class="t title" text-anchor="middle">2023年阿克苏地区苹果种植与挂果面积</text>
  <line x1="80" y1="390" x2="430" y2="390" class="axis"/>
  <line x1="80" y1="70" x2="80" y2="390" class="axis"/>
  <g class="t small">
    <text x="70" y="395" text-anchor="end">0</text>
    <text x="70" y="342" text-anchor="end">10</text>
    <text x="70" y="289" text-anchor="end">20</text>
    <text x="70" y="236" text-anchor="end">30</text>
    <text x="70" y="183" text-anchor="end">40</text>
    <text x="70" y="130" text-anchor="end">50</text>
    <text x="70" y="77" text-anchor="end">60</text>
  </g>
  <g>
    <line x1="80" y1="337" x2="430" y2="337" class="grid"/>
    <line x1="80" y1="284" x2="430" y2="284" class="grid"/>
    <line x1="80" y1="231" x2="430" y2="231" class="grid"/>
    <line x1="80" y1="178" x2="430" y2="178" class="grid"/>
    <line x1="80" y1="125" x2="430" y2="125" class="grid"/>
    <line x1="80" y1="72" x2="430" y2="72" class="grid"/>
  </g>
  <rect x="155" y="122.4" width="80" height="267.6" fill="#f6c38d"/>
  <rect x="280" y="134.4" width="80" height="255.6" fill="#a8d8a0"/>
  <text x="195" y="112" class="t value" text-anchor="middle">50.48</text>
  <text x="320" y="124" class="t value" text-anchor="middle">48.23</text>
  <text x="195" y="417" class="t mid" text-anchor="middle">种植面积</text>
  <text x="320" y="417" class="t mid" text-anchor="middle">挂果面积</text>
  <text x="22" y="235" class="t mid" transform="rotate(-90 22 235)" text-anchor="middle">面积/万亩</text>
  <text x="245" y="455" class="t mid" text-anchor="middle">（a）</text>

  <!-- Right panel -->
  <text x="790" y="30" class="t title" text-anchor="middle">阿克苏地区林果总产量与苹果产量</text>
  <line x1="520" y1="390" x2="1060" y2="390" class="axis"/>
  <line x1="520" y1="70" x2="520" y2="390" class="axis"/>
  <g class="t small">
    <text x="510" y="395" text-anchor="end">0</text>
    <text x="510" y="338" text-anchor="end">50</text>
    <text x="510" y="281" text-anchor="end">100</text>
    <text x="510" y="224" text-anchor="end">150</text>
    <text x="510" y="167" text-anchor="end">200</text>
    <text x="510" y="110" text-anchor="end">250</text>
    <text x="510" y="76" text-anchor="end">280</text>
  </g>
  <g>
    <line x1="520" y1="333" x2="1060" y2="333" class="grid"/>
    <line x1="520" y1="276" x2="1060" y2="276" class="grid"/>
    <line x1="520" y1="219" x2="1060" y2="219" class="grid"/>
    <line x1="520" y1="162" x2="1060" y2="162" class="grid"/>
    <line x1="520" y1="105" x2="1060" y2="105" class="grid"/>
  </g>

  <!-- 2020 -->
  <rect x="565" y="109.3" width="34" height="280.7" fill="#f6c38d"/>
  <rect x="603" y="305.9" width="34" height="84.1" fill="#a8d8a0"/>
  <text x="582" y="100" class="t value" text-anchor="middle">245.59</text>
  <text x="620" y="297" class="t value" text-anchor="middle">73.55</text>
  <text x="601" y="416" class="t mid" text-anchor="middle">2020</text>

  <!-- 2021 -->
  <rect x="690" y="101.5" width="34" height="288.5" fill="#f6c38d"/>
  <rect x="728" y="292.3" width="34" height="97.7" fill="#a8d8a0"/>
  <text x="707" y="92" class="t value" text-anchor="middle">252.43</text>
  <text x="745" y="283" class="t value" text-anchor="middle">85.49</text>
  <text x="726" y="416" class="t mid" text-anchor="middle">2021</text>

  <!-- 2022 -->
  <rect x="815" y="93.1" width="34" height="296.9" fill="#f6c38d"/>
  <rect x="853" y="292.8" width="34" height="97.2" fill="#a8d8a0"/>
  <text x="832" y="84" class="t value" text-anchor="middle">259.77</text>
  <text x="870" y="283" class="t value" text-anchor="middle">85.09</text>
  <text x="851" y="416" class="t mid" text-anchor="middle">2022</text>

  <!-- 2023 -->
  <rect x="940" y="90.0" width="34" height="300.0" fill="#f6c38d"/>
  <rect x="978" y="296.2" width="34" height="93.8" fill="#a8d8a0"/>
  <text x="957" y="81" class="t value" text-anchor="middle">262.46</text>
  <text x="995" y="287" class="t value" text-anchor="middle">82.10</text>
  <text x="976" y="416" class="t mid" text-anchor="middle">2023</text>

  <text x="475" y="235" class="t mid" transform="rotate(-90 475 235)" text-anchor="middle">产量/万吨</text>
  <text x="790" y="455" class="t mid" text-anchor="middle">（b）</text>

  <!-- legends -->
  <rect x="690" y="47" width="18" height="12" fill="#f6c38d"/>
  <text x="716" y="58" class="t small">林果总产量</text>
  <rect x="820" y="47" width="18" height="12" fill="#a8d8a0"/>
  <text x="846" y="58" class="t small">苹果产量</text>

  <text x="550" y="486" class="t small" text-anchor="middle">图1 阿克苏地区苹果产业规模及其在特色林果业中的产量贡献</text>
</svg>